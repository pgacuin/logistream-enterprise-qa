name: LogiStream CI Pipeline

on:
  push:
    branches: [ main, mission-06, mission-07, mission-08-senior ]
  pull_request:
    branches: [ main, mission-06, mission-07, mission-08-senior ]

jobs:
  test-sharded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Run Playwright Tests (Sharded)
        run: npx playwright test --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  senior-release-gate:
    runs-on: ubuntu-latest
    needs: test-sharded
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Verify TypeScript Strict Compilation
        run: npx tsc --noEmit
      - name: Run Senior Release Gate Suite
        run: npx playwright test tests/senior-release-gate.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: senior-release-gate-report
          path: playwright-report/
          retention-days: 30
