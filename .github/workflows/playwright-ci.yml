name: LogiStream CI Pipeline
on:
  push:
    branches: [ main, mission-06 ]
  pull_request:
    branches: [ main, mission-06 ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TODO FOR LEARNER: Define a matrix shard setup with 3 shards
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Run Playwright Tests (Sharded)
        # TODO FOR LEARNER: Execute npx playwright test with --shard=${{ matrix.shard }}
        run: npx playwright test --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30
